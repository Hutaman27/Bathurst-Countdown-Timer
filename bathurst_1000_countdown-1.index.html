<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>BATHURST 1000 Countdown</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#050505;color:#fff}
  body{display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:min(720px,100%);text-align:center;border:2px solid #fff;border-radius:24px;padding:34px 18px;background:#101010;box-shadow:0 10px 40px #000}
  h1{font-size:clamp(30px,8vw,64px);margin:0 0 8px;font-weight:900;letter-spacing:.04em}
  .date{font-size:clamp(15px,4vw,22px);margin-bottom:28px;opacity:.8}
  .countdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .unit{background:#000;border-radius:16px;padding:18px 5px}
  .num{font-size:clamp(38px,11vw,82px);font-weight:900;line-height:1}
  .label{font-size:12px;letter-spacing:.15em;margin-top:10px;opacity:.7}
  .note{margin-top:24px;font-size:12px;opacity:.5}
</style>
</head>
<body>
<main class="card">
  <h1>BATHURST 1000</h1>
  <div class="date">STARTS SUNDAY 11 OCTOBER 2026 • 1:30 PM</div>
  <div class="countdown">
    <div class="unit"><div class="num" id="days">--</div><div class="label">DAYS</div></div>
    <div class="unit"><div class="num" id="minutes">--</div><div class="label">MINUTES</div></div>
    <div class="unit"><div class="num" id="seconds">--</div><div class="label">SECONDS</div></div>
  </div>
  <div class="note">Countdown uses your phone's local time.</div>
</main>
<script>
const target = new Date("2026-10-11T13:30:00");
function update(){
  let ms = target - new Date();
  if(ms <= 0){
    document.getElementById("days").textContent="0";
    document.getElementById("minutes").textContent="0";
    document.getElementById("seconds").textContent="0";
    return;
  }
  const totalSeconds = Math.floor(ms/1000);
  const days = Math.floor(totalSeconds/86400);
  const minutes = Math.floor((totalSeconds % 3600)/60);
  const seconds = totalSeconds % 60;
  document.getElementById("days").textContent=days;
  document.getElementById("minutes").textContent=String(minutes).padStart(2,"0");
  document.getElementById("seconds").textContent=String(seconds).padStart(2,"0");
}
update();
setInterval(update,1000);
</script>
</body>
</html>
